name: shufang_flutter
description: ShuFang — Desktop Writing IDE (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  crypto: 3.0.6
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  window_manager: ^0.4.3
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # T-25: 像素精灵 PICO-8 帧数据 (从 .dart 硬编码外置到 JSON)
  assets:
    - assets/companion/
  # T-13: NotoSerifSC 字体 (可选增强, 当前降级为系统宋体回退)
  # 下载字体文件到 assets/fonts/ 后取消下方注释, 并将 typography.dart
  # _serifFamily 从 'serif' 改为 'NotoSerifSC' 即可启用.
  # 当前 'serif' 在 Windows 上回退到 SimSun (宋体), 跨平台兼容.
  # fonts:
  #   - family: NotoSerifSC
  #     fonts:
  #       - asset: assets/fonts/NotoSerifSC-Regular.ttf
  #       - asset: assets/fonts/NotoSerifSC-Bold.ttf
  #         weight: 700
